spring.application.name=mindcare-backend
server.port=${PORT:8080}

# --- Database ---
# This file is committed, so it deliberately has no working default password.
# For local dev: create the role/db once, then set real values in a
# gitignored backend/application.properties (see application.properties.example),
# which Spring Boot auto-loads and overrides these placeholders with.
#   sudo -u postgres psql -c "CREATE ROLE mindcare WITH LOGIN PASSWORD '...';"
#   sudo -u postgres psql -c "CREATE DATABASE mindcare OWNER mindcare;"
# DB_URL, if set, wins outright (e.g. a hosting platform's full connection
# string). Otherwise it's built from DB_HOST/DB_PORT/DB_NAME, which default
# to a local Postgres instance.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mindcare}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USERNAME:mindcare}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Auth ---
# No working default on purpose: startup fails loudly until a real base64,
# 256-bit+ secret is supplied via JWT_SECRET (env var or local override file).
# Generate one with: python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(48)).decode())"
mindcare.jwt.secret=${JWT_SECRET:REPLACE_ME_WITH_A_GENERATED_BASE64_SECRET}
mindcare.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- CORS (local frontend dev servers) ---
mindcare.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4500,http://127.0.0.1:4500,http://localhost:5500,http://127.0.0.1:5500}

# --- First maintenance account bootstrap (blank = skip; see MaintenanceAccountSeeder) ---
mindcare.seed.maintenance-email=${SEED_MAINTENANCE_EMAIL:}
mindcare.seed.maintenance-password=${SEED_MAINTENANCE_PASSWORD:}
mindcare.seed.maintenance-name=${SEED_MAINTENANCE_NAME:Maintenance Admin}

# --- Google Calendar / Meet (one clinic account, see GoogleOAuthController) ---
# Blank client-id/secret/refresh-token = video links are simply unavailable
# (appointment approval will fail clearly) until the one-time OAuth setup is done.
mindcare.google.client-id=${GOOGLE_CLIENT_ID:}
mindcare.google.client-secret=${GOOGLE_CLIENT_SECRET:}
mindcare.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}
mindcare.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
mindcare.google.calendar-id=${GOOGLE_CALENDAR_ID:primary}
mindcare.google.timezone=${GOOGLE_CALENDAR_TIMEZONE:UTC}
